<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="get" action="#">
        <table width="400" border="1">
    <tr bgcolor="whitesmoke" height="50">
        <th colspan="2">
            step 1: 아이디/비번 입력
        </th>
    </tr>
    <tr height="35">
        <td align="center">아이디</td>
        <td><input type="text" name="id"></td>
    </tr>
    <tr height="35">
        <td align="center">비밀번호</td>
        <td><input type="password" name="pw"></td>
    </tr>
    <tr height="35">
        <td align="center">비밀번호확인</td>
        <td><input type="password" name="pwc"></td>
    </tr>
    <tr bgcolor="whitesmoke" height="50">
        <th colspan="2">
            step 2: 개인정보
        </th>
    </tr>
    <tr>
        <td align="center">성별</td>
        <td>남<input type="radio" name="gender" value="man">
        여<input type="radio" name="gender" value="woman"></td>
    </tr>
    <tr>
        <td align="center">혈액형</td>
        <td><select><option>A형</option>
        <option>B형</option>
        <option>AB형</option>
        <option>O형</option></select></td>
    </tr>
    <tr>
        <td align="center">생일</td>
        <td> <input type="date"></td>
    </tr>
    <th colspan="3"> step 3 : 선호도</th>
        <tr>
            <td> 취미 </td>
            <td> 축구<input type="checkbox" name="soccer" value="s">
                 야구<input type="checkbox" name="baseball" value="bb">
                 농구<input type="checkbox" name="basketball" value="kb">
            </td>
        </tr>
        <tr>
            <td> 좋아하는 색</td>
            <td> <input type="color"></td>
        </tr>
        <tr bgcolor="whitesmoke" height="50">
            <th colspan="2">
                step4 : 하고싶은 말
            </th>
        </tr>
        <tr height="35">
            <td colspan="2">
            <textarea cols="57" rows="5"></textarea>
            </td>
        </tr>
        <tr height="35" align="center">
            <td colspan="2"><input type="submit" value="제출">
            <input type="reset" value="초기화"></td>
        </tr>

    </table>
    </form>
</body>
</html>
