<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
        form 태그 
         웹 페이지에 입력폼을 만들 때 사용하는 태그
         사용자에게 정보를 받아주는 태그
          - 필수 속성 2가지 : method(전달 방식), action(전달 위치)
          
    -->

    <form method="get" action="#">

        <!-- 
            input 태그 : 사용자가 입력할 수 있는 공간 
            ** 속성 **
            (1) name : 입력한 값을 구분하기 위해 이름을 지정
            (2) placeholder : 미리보기 텍스트
            (3) maxlength : 글자 수 제한 지정
            (4) autofocus : 자동 커서 설정
            (5) value : 기본 값 설정
            (6) readonly : 읽기 전용 지정
            
        -->
            <h4>입력</h4>
            
            ID <input type="text" name="ID" placeholder="아이디를 입력하세요" autofocus>
            PW <input type="password" name="PW" maxlength="20" placeholder="비밀번호를 입력하세요">
            주소 <input type="text" name="add" value="광주" readonly>
            
            
            <h4>선택</h4>
            <!-- 
               (1) input 태그 type이 checkbox
               (2) input 태그 type이 radio
               (3) select 태그  

            -->
            <!-- 
                checkbox와 radio는 필수 속성이 2개 존재
                - name : 어떤 설문(항목)인지?
                - value : 어떤 값인지?
            -->
            <!-- (1) checkbox 중복 선택 가능 -->
            <p> 좋아하는 음료를 모두 골라주세요 </p>
            몬스터<input type="checkbox" name="menu" value="m">
            펩시제로라임<input type="checkbox" name="menu" value="p">
            <!-- (2) radio 중복 불가 -->
            <p> 성별을 골라주세요 </p>
            남<input type="radio" name="gender" value="man">
            여<input type="radio" name="gender" value="woman">

            <!-- (3) select 태그 
                    => option이라는 태그가 필요!
             -->
        <br><BR>

        <select>
            <option> A형 </option>
            <option> B형 </option>
            <option> AB형 </option>
            <option> O형 </option>
        </select>
        <br>
        <!-- 
            textarea : 게시물, 게시글 입력 공간
                cols : 텍스트 영역의 가로 너비를 문자단위로 지정
                rows : 텍스트 영역의 세로 길이를 줄단위로 지정
        -->
        <textarea cols="30" rows="5"></textarea>

        <h4> 그 외 종류</h4>
        <br>
        <input type="color">
        <br>
        <input type="file">
        <br>
        <input type="number">
        <br>
        <input type="range">
        <br>
        <input type="date">
        <br>
        <input type="datetime-local">
        <br>
        <h4>제출 및 초기화</h4>
        <!-- 
            제출 및 초기화 정보는 form태그 안쪽 시작 ~ 끝 데이터만
            제출 및 초기화 위치는 form태그 안에 작성
        -->
        <input type="submit" value="제출">
        <input type="reset" value="초기화">
    </form>
</body>
</html>
