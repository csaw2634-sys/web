<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
        강조 태그 : b , strong
        b 태그 : 글자를 굵게! 시각적 의미의 강조
        strong 태그 : 글자를 굵게! 실질적 의미의 강조
    
    -->
    <p> p 태그</p>
    <b> b 태그 </b>
    <br>
    <strong> strong 태그 </strong>

    <!-- 
        강조 태그 : i, em
        i 태그 : 글자를 기울임
        em 태그 : 글자를 기울임 (실질적 의미 강조)
    -->
    <br>
    <i> i 태그 </i>
    <em> em 태그 </em>
<br>
    <!-- mark 태그 : 형광펜 처리 -->

    <mark> mark 태그 </mark>

    <!-- 
        첨자 태그 : sup, sub
        sup : 윗첨자 태그
        sub : 아래첨자 태그
        -->

    <p><sup>윗첨자</sup>입니다</p>
    <p><sub>아랫첨자</sub>입니다</p>
    
</body>
</html>
