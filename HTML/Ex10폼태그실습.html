<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 배경색 : bgcolor = ""
         높이 : height = ""
         글자 가운데 정렬 : align = "center"
         rowspan : 위, 아래를 병합 (행 병합)
         colspan : 좌, 우를 병합 (열 병합) 

         textarea cols = "57" rows = "5"
         step 부분 height ="50"
         밑 항목 부분 height = "35"
         bgcolor = "whitesmoke"
    -->
    <form method="get" action="#">
        <table width="400" border="1">
            <tr bgcolor="whitesmoke" height="50">
            <th colspan="3"> step 1: 아이디/비번 입력</th></tr>
        <tr>
        <td> 아이디</td>
           <td><input type="text" name="ID"></td>
        </tr>
        <tr>
        <td> 비밀번호</td>
            <td><input type="text" name="PW"></td>
        </tr>
        <tr>
        <td> 비밀번호 확인</td>
            <td><input type="text" name="pwcheck"></td>
        </tr>
        <tr>
        <th colspan="3"> step 2 : 개인정보</th>
        </tr>
        <tr>
        <td> 성별</td>
            <td> 남<input type="radio" name="man" value="man">
             여<input type="radio" name="woman" value="woman"></td>
        </tr>
        <tr>
            <td>혈액형</td>
            <td> <select>
            <option> A형 </option>
            <option> B형 </option>
            <option> AB형 </option>
            <option> O형 </option>
        </select></td>
        </tr>
        <tr>
            <td> 생일</td>
            <td><input type="date"></td>
        </tr>
        <th colspan="3"> step 3 : 선호도</th>
        <tr>
            <td> 취미 </td>
            <td> 축구<input type="checkbox" name="soccer" value="s">
                 야구<input type="checkbox" name="baseball" value="bb">
                 농구<input type="checkbox" name="basketball" value="kb">
            </td>
        </tr>
        <tr>
            <td> 좋아하는 색</td>
            <td> <input type="color"></td>
        </tr>
        <tr>
            <th colspan="2"> step 4 : 하고싶은 말</th>
        <td><textarea cols="57" rows="5"></textarea></td></tr>
        

        <tr>
            <td align="center">
            <input type="submit" value="제출">
            <input type="reset" value="초기화"></td>
        </tr>
        </table>
    

    </form>
</body>
</html>
