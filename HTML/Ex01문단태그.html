<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
        제목 태그 : h 
        1 ~ 6까지 숫자를 붙여서 사용
        숫자가 작을수록 크기가 크다
    -->

    <h1>h1 태그 </h1>
    <h2>h2 태그</h2>
    <h3>h3 태그</h3>
    <h4>h4 태그</h4>
    <h5>h5 태그</h5>
    <h6>h6 태그</h6>
    <!-- 
        내용 태그 : p, span 
        p 태그 : 단락으로 표현, 가로 한줄을 전부 차지
        span 태그 : 문장으로 표현, 내가 적은 내용 만큼만 차지
        -->
        <p> p태그1 </p>
        <p> p태그2 </p>
        <span> span태그1 </span>
        <br>                
        <span> span태그2 </span>

        <!-- 
            br : 개행 태그
              => 강제 줄바꿈을 해주는 태그

            hr : 구분선 태그
              => 구분선을 그려주는 태그
        -->

        <hr>

        <hr color="red" width="150px" size="140px">
</body>
</html>
