<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
        (1) 리스트 공간 선언 : ul, ol 
            -> ul, ol 둘 다 li 태그가 필요하다.
            ul : 순서 없는 목록
            ol : 순서 있는 목록
            (2) 리스트 내 실질적인 데이터 : li
    -->

    <ul type="square">
        <li>html</li>
        <li>css</li>
        <li>java</li>
    </ul>
<hr>
    <ol>
        <li>html</li>
        <li>css</li>
        <li>java</li>
    </ol>

</body>
</html>
