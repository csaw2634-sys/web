<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 객체 : 여러 데이터(자료형)를 하나의 변수에 저장할 수 있는 데이터 파일
        // -> 기본자료형, 참조자료형 모두 값(value)으로 저장 가능
        // 객체의 구조 : {key1 : value1, key2 : value2 ...}
        // key = 객체의 속성(property)
        // value = 객체의 데이터(값)

        // 내장객체 : JS에서 제공되는 객체
        // 브라우저객체 : JS에서 실행시 브라우저 객체를 제공
        // 사용자 정의 객체 : 개발자가 직접 만든 객체

        // 사용자 정의 객체
        let person = {
            name : '김경민',
            age : 10,
            male : true,
            refer : function(){
                console.log('객체 활용하기');
            },
            favorite : {
                food : 'pizza',
                drink : 'coke',
            },
            fruit : ['키위','사과','오렌지']
        }
        // 객체 접근
        // 객체변수면.key(속성)
        console.log(person);
        // 이름, 나이, 성별, 함수, 음식 1개, 과일 1개 콘솔창에 출력하기!
        console.log(person.name);
        console.log(person.age);
        console.log(person.male);
        person.refer();
        console.log(person.favorite.food);
        console.log(person.fruit[1]);

        // 속성 값 변경 및 추가 해보기
        // 변경 -> 객체변수명.key = 변경값;
        person.name = '애애애애'
       console.log(person.name);

       // 추가 -> 객체변수명.추가key = 추가할 값;
       person.height = 55555555;
       console.log(person.height)
    </script>
</body>
</html>
