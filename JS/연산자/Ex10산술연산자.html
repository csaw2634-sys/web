<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num1 = 15;
        let num2 = 6;

        console.log(num1 + num2);
        console.log(num1 - num2);
        console.log(num1 * num2);
        console.log(num1 / num2); // 15/6 =2.5
        console.log(num1 % num2);
        
        // 몫을 구하고 싶다면?
        console.log(parseInt(num1 / num2));

        
    </script>
</body>
</html>
