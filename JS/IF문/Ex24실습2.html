<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 입력받은 숫자가 2의 배수이면서 6의 배수라면 '2와 6의 배수입니다.'를 출력하고
        //  조건이 맞지 않다면 '2와 6의 배수가 아닙니다.'를 출력하시오.
        let num = prompt('숫자를 입력')
        if(num%2==0 && num%6==0){
            console.log('2와6의 배수입니다.')
        }else{
            console.log('2와 6의 배수가 아닙니다.')
        }


    </script>
</body>
</html>
