<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <Script>
        // do ~ while 문
        // 조건식이 true면 계속 반복하지만
        // 맨 처음에는 조건식에 상관없이 무조건 한 번은 실행

        /* do{
            실행문;
        }while(조건식); */

        let num = 10;

        do{
            console.log('실행!');
        }while( num === 5);



    </Script>
</body>
</html>
