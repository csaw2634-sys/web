    <script>

        /* switch(식){

                실행문2;

        // 식과 값을 비교할 때는 ==(동등비교연산자)가 아닌 ===(일치비교연산자)를 사용
        switch(10){
            case '10':
                console.log('문자 10');
                break;
            case 10 :
                console.log('숫자 10');
                break;
            
        }
