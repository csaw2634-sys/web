<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        
    //국어, 영어, 수학 점수를 입력받은 후 평균과 학점을 출력하시오.
    //(평균 90~100점 : A, 80~89 : B, 70~79 : C, 이 외에는 F)
        let 국어 = prompt('국어 점수를 입력하세요.')
        let 영어 = prompt('영어 점수를 입력하세요.')
        let 수학 = prompt('수학 점수를 입력하세요.')
        let 평균 = parseInt((parseInt(국어)+parseInt(영어)+parseInt(수학))/ 3)
        let grade;
        

        if(평균>=90&&평균<=100){
            console.log(`당신의 평균은 ${평균}이고 A학점입니다.`)
        }else if(평균>=80&&평균<=89){
            console.log(`당신의 평균은 ${평균}이고 B학점입니다.`)
        }
        else if(평균>=70&&평균<=79){
            console.log(`당신의 평균은 ${평균}이고 C학점입니다.`)
        }
        else{
            console.log(`당신의 평균은 ${평균}이고 F학점입니다.`)
        }

    </script>
</body>
</html>
