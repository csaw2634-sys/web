<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num = 1;
        
        /* while( num <= 3){
            console.log(num);
            num ++;
        } */

        // while문은 주로 반복횟수가 정해지지 않았을 때
        // 주로 사용하므로 조건식을 true(무한반복)으로 설정하고
        // while문 안에서 특정 조건을 충족했을 시 탈출하게 함!

        while(true){
            console.log(num);
            
            if (num>=3){
                break;
                    }
            num++;
                };

    </script>
</body>
</html>
