<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 배열(array)
        // 빈 배열 생성하기 - []
        let array= [];
        
        // 값 삽입하기
        // 인덱스를 활용

        array[0] = 1;
        array[1] = 2;


        // 함수를 활용
        // 마지막 위치에 데이터를 추가하는 함수 -> push(값)
        array.push(3); // 2번 인덱스
        array.push(4); // 3번 인덱스 

        // 0번 인덱스 ~ 마지막 인덱스까지 접근해보기
        // for문 활용
        for(let i = 0; i < array.length; i++){
                console.log(array[i]);
        }
        
        // 데이터만 확인하고 싶을 때 array모든 데이터 출력하기
        console.log(array);

        // 값 수정하기
        // 배열명[인덱스] = 수정할 값;
        array[2] = 7;
        console.log(array) 

        // 값 삭제하기
        // 마지막 데이터 삭제 -> pop()
        array.pop();
        console.log(array);

        // splice(인덱스, 삭제할 개수)
        // 인덱스 : 삭제할 데이터의 위치
        // 삭제할 개수 : 해당 인덱스로부터 삭제할 개수
        array.splice(0, 2)
        console.log(array);

        // 배열의 함수 
        let arr =[1,2,3,4,5];

        // 배열명.includes(찾고싶은 요소)
        // 배열 안에 3이라는 요소가 있는지 확인 -> true or false 반환
        console.log(arr.includes(9))

        // 배열명.indexOf(찾고싶은 요소)
        // 4라는 요소의 인덱스를 반환
        // 해당 요소가 없다면 -1을 반환
        console.log(arr.indexOf(4))

        // arr에서 2,3,4만 가지고 오고 싶을 떄 
        // 배열명.slice(시작인덱스,끝인덱스+1)
        // but, 끝인덱스는 포함하지 않는다.
        console.log(arr.slice(1,4))
        console.log(`${arr.slice(1,2)}`);

        // 2차원 배열 생성하기
        let arr2 = [[1,2,3],
                    [4,5,6],
                    [7,8,9]];
        // 2차원 배열에서 '6' 데이터에 접근하기
        console.log(arr2[1][2])
        
    </script>
</body>
</html>
