<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 함수 : function

        // 함수 선언
        // 매개변수X, 반환값X
        function js(){
            console.log('JS 재밌다!');
        }
        // 함수 호출
        js();
        js();
        js();
        // 매개변수O, 반환값X
        // 제 이름은 '???'입니다
        // 함수명과 변수명은 의미있게 짓기
        function greet_name(name){
            console.log(`제 이름은 ${name}입니다.`)
        };
        greet_name('김경민');

        // 매개변수를 복수개 사용
        function sum(num1, num2){
            console.log(num1 +num2);
        }
        sum(5,4);

        // 매개변수O, 반환값 O
        // 세 개의 수를 곱한값 콘솔창에 출력하기
        function multi(num1,num2,num3){
            return num1*num2*num3;
        }
        console.log(multi(1,2,3));



    </script>
</body>
</html>
