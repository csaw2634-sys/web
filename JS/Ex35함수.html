<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 같은 코드를 반복해서 작성
        /* console.log('안녕하세요');
        console.log('안녕하세요');
        console.log('안녕하세요');
        console.log('안녕하세요'); */

        // 함수(function)
        // - 특정 기능을 수행하는 코드의 묶음
        // - 필요할 때 호출해서 사용할 수 있음

        // 함수 선언 방법
        /* function 함수명(매개변수){
            실행할 코드;
            return 반환값;
        } 
        -> 매개변수와 반환값은 있을수도 있고 없을수도 있음 */

        // 1. 함수 선언하기
        // - 어떤 작업을 할 것인지 정의

        function h_o(){
            console.log('안녕하세요');
        }
        
        // 2. 함수 호출
        // - 정의한 작업을 실제로 실행
        // 함수명(매개변수)
        h_o();

        // 리턴(반환) 값이 있는 함수 만들어보기
        function hellow(){
            return '안녕';
        };
        console.log(hellow());

    </script>
</body>
</html>
