<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>   
    <button onclick="hello()">클릭</button>
    <!-- 
        onclick() : 클릭 이벤트가 발생했을 때
        hello() : 실행할 함수 
    -->

    <script>
        //이벤트(Event)
        // - 웹 페이지에서 발생하는 사건 혹은 동작

        // 대표적인이벤트
        // click : 마우스 클릭
        // mouseover : 마우스를 요소 위에 올렸을 때
        // keydown : 키보드 키를 눌렀을 때
        // change : 입력값 변경이 확정됐을 때


        function hello(){
            alert('안녕하세요');
        }
    </script>
</body>
</html>
