<body>
    <script>
        // greet()라는 함수를 선언하고 console창에 다음과 같이 출력하기
        function greet(){
            console.log( 'JavaScript 수업입니다.') 
            console.log('함수 공부를 시작합시다.');
        }
        greet()
        // JavaScript 수업입니다.
        // 함수 공부를 시작합시다.
        // 반환값X

    </script>
