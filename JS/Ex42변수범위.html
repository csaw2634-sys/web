<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 전역변수 : 함수 바깥에서 선언한 변수
        // 지역변수 : 함수 내부에서 선언한 변수

        let num1 = 10; // 전역변수
        function test(){
            
            let num2 = 5; // 지역변수

            console.log(num1);
            console.log(num2);
        }

        test()

        console.log(num1);
        console.log(num2);

        
    </script>
</body>
</html>
