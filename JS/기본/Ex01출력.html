<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        // Ctrl + / : 주석(한줄)

        /* 
        alt + shift + a : 여러줄 주석
        */
        
        // 웹 페이지에 직접 출력
        // document.write('출력할 내용')
        // document : 현재 문서(html)
        // write() : 현재 문서내에서 작성하는 기능
        document.write('즐거운 화요일!');

        // 태그도 적용 가능

        document.write('<h1>안녕!!</h1>');

        // console.log('출력할 내용')
        // 개발자 도구 (F12)의 console창에 출력
        // 주로 변수 값 확인이나, 데이터가 잘 넘어오는지 체크할 때 많이 사용
        console.log('여기는 콘솔창입니다.');
         
        // log 이외에도 다른 기능
        console.warn('경고');
        console.error('오류');

        // 알림창에 출력
        // 사용자에게 단순메세지를 전달할 때 사용
        // alert('출력할 내용')
        alert('정상적으로 로그아웃에 성공했습니다.');
         
    </script>
</body>
</html>
