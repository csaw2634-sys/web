<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // introduce() 함수를 선언하고
        // 이름과 나이를 매개변수로 전달받기(매개변수 2개)
        // 전달받은 매개변수를 활용해 아래와 같이 출력하기
        function introduce(name, age){
            console.log(`안녕하세요. 저는 ${name}이고 ${age}살 입니다.`)
        }
        
        // 안녕하세요. 저는 ''이고 {나이}살 입니다.
        // 반환값x
        introduce('김경민', 11)
    </script>
</body>
</html>
