<body>
    <script>
        // divide() 함수를 선언하고
        // 매개변수 숫자 2개를 사용하기
        // 두 숫자를 나눈 결과를 반환하기
        // 반환한 값을 콘솔창에 출력하기

        function divide(num1,num2){
            return num1/num2
        }
        console.log(divide(5,2));


    </script>
