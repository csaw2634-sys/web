<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 내장객체
        // -> JS에서 기본적으로 제공하는 라이브러리
        // 여러가지 기능들을 가지고있는 라이브러리 불러오기
        let today = new Date();

        let t_year = today.getFullYear(); // 년도
    
        // "현재 달"을 가져오는게 아닌 0부터 시작하는 인덱스를 가져옴
        // 인덱스 (0~11) -> 달(1월 ~12월)

        let t_month = today.getMonth(); // 달 
        
        // 일
        let t_date = today.getDate();
        // 요일
        // 인덱스 (0~6) -> (일요일 ~ 토요일)
        let t_day = today.getDay();

        let days = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일']

        // 시간
        let t_hour = today.getHours();
        // 분
        let t_minute = today.getMinutes();
        // 초
        let t_seconds = today.getSeconds();

        console.log(`${t_year}년 ${t_month +1}월 ${t_date}일 (${days[t_day]})`);
        console.log(`${t_hour}시 ${t_minute}분 ${t_seconds}초`);
        
    </script>

</body>
</html>
