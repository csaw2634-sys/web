<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        /* 
            border : 요소의 테두리 
            -> width : 두께
            -> style : 스타일(실선, 점선, 이중선 ...)
            -> color : 색상

        */

        #redbox{
            border-width: 10px;
            border-style: ridge;
            border-color: red;
        }
        #bluebox{
            border: 10px turquoise ridge;
        }
    </style>
</head>
<body>
    <div id="redbox">Box</div>
    <div id="bluebox">Box</div>



</body>
</html>
