<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            font-size: 20px;
            font-weight: 700;
            font-style: italic;
            font-family: 'aggravo';
        }
        /* 
            font-size : 폰트 크기
            font-weight : 폰트 굵기 -> 100 ~ 900 숫자를 사용, 700(bold)
            font-style : 폰트 스타일
            font-family : 폰트 종류(글꼴)
        
        */
        @font-face {
    font-family: 'Aggravo';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/SBAggroL.woff') format('woff');
    font-weight: 300;
    font-display: swap;
}

@font-face {
    font-family: 'Aggravo';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/SBAggroM.woff') format('woff');
    font-weight: 500;
    font-display: swap;
}

@font-face {
    font-family: 'Aggravo';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/SBAggroB.woff') format('woff');
    font-weight: 700;
    font-display: swap;
}
    </style>
</head>
<body>
    <p> 폰트의 속성 적용해보기</p>
</body>
</html>
