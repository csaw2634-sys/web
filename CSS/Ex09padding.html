<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        /* 
            padding
            테두리를 기준으로 요소의 안쪽 여백을 지정하는 속성
            테두리와 내용 사이 여백

            => 사용법은 margin과 동일 (auto 속성값은 존재하지 않는다.)
               **주의할 점!!!**
               => HTML 요소 크기에 영향을 미친다!

        */
        div{
            width: 100px;
            height: 100px;
        }
        #box1{
            background-color: red;
            
        }
        #box2{
            background-color: yellow;
           padding-left: 100px;
        }
        #box3{
            background-color: orange;
          
        }
        #box4{
            background-color: blue;
           
        }
    </style>
</head>
<body>
    
    <div id="box1">box</div>
    <div id="box2">box</div>
    <div id="box3">box</div>
    <div id="box4">box</div>

</body>
</html>
