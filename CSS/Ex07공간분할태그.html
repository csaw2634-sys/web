<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
        공간 분할 태그: div, p, span
        - div(division) : 블록 요쇼로 웹페이지에서 영역 구분할 때 사용
        => 줄 바꿈이 자동으로 발생하며, 주로 레이아웃 구성에 사용됨
        - p(paragraph) : 블록 요소로 단락(문단)을 나타냄
        => 줄 바꿈이 자동으로 발생하며, 글을 문단 단위로 나눌때 사용
        - span : 인라인 요소로 텍스트 내부의 특정 부분만 스타일링할 때 사용
        => 줄 바꿈없이 텍스트 흐름 안에서 사용되며, p와 달리 레이아웃 분할에는 사용되지 x

        시멘틱 태그 : header, nav, main, article, section, footer, aside 등
        => div 태그와 동일하게 사용, 사용처를 명확하게 표현하기 위해서 사용
    -->
</body>
</html>
