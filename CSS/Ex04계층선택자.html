<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    /* 
        (1) 자손 선택자 - 기호 : 띄어쓰기
        (2) 자식 선택자 - 기호 : >
        (3) 형제 선택자 - 기호 : ~
        (4) 인접형제 선택자 - 기호 : +

        nth-child()
         => 부모의 자식요소 중 n번째인 요소를 선택한다
            모든 자식요소의 순서를 확인 하지만 
            nth-child 요소 사용 시 n번째 자식이면서 태그가 일치하는 경우
    */
    /*  div를 기준으로 span 색 변경 */
    div span{
        color:red ;
    }

    /* 첫번째 li를 기준으로 li의 색 변경 */

    li~li{
        color:blue;
    }
    /* li를 기준으로 근접해서 붙어있는 li의 색 변경 */
    li:nth-child(1)+li{
        color: green;
    }


</style>
</head>
<body>
    <div>
        <strong>우리 반 규칙!</strong>
        <ol>
            <li>지각하지 않기!</li>
            <li>결석하지 않기!</li>
            <!-- <span>불가피할 땐 꼭 연락하기</span> -->
            <li>복습하기!</li>
        </ol>
    </div>
</body>
</html>
