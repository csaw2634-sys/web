<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* (1) 대상:hover => 마우스를 올렸을 때 작동  */
        h1:hover{
            color: blue;
        }
        
        /* (2) 대상:active => 마우스를 클릭했을 때 작동*/
        h1:active{
            color: red;
        }
    </style>
</head>
<body>
    <h1>반응 선택자 실습</h1>    

</body>
</html>
